[project]
name = "so101-pick-place"
version = "0.1.0"
description = "SO-101 pick-and-place robotics experiments using LeRobot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",  # Import-related style errors
    "E7",  # Statement formatting errors
    "E9",  # Syntax errors
    "F",   # Pyflakes: unused imports, undefined variables, etc.
    "I",   # Import sorting
    "B",   # Bugbear: common Python bugs and design pitfalls
    "UP",  # Modern Python syntax recommendations
]
